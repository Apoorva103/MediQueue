<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediQueue - Staff Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <div class="card shadow login-card p-4">
        <h3 class="text-center text-primary mb-3">MediQueue Staff Portal</h3>
        <p class="text-center text-muted mb-4">Enter staff password to access management features.</p>
        
        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label for="password" class="form-label">Staff Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password (default: admin)">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login to Dashboard</button>
            <a href="{{ url_for('home') }}" class="btn btn-link w-100 mt-2">Back to Public View</a>
        </form>
    </div>

</body>
</html>
