<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediQueue - Patient Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background-color: #0d6efd; color: white; min-height: 100vh; padding: 20px; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar d-none d-md-block">
                <h3>MediQueue</h3>
                <p class="text-white-50">Hospital System</p>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a href="{{ url_for('home') }}" class="nav-link text-white">Dashboard</a></li>
                    <li class="nav-item mb-2"><a href="{{ url_for('register') }}" class="nav-link text-white active">Patient Registration</a></li>
                </ul>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-10 p-4">
                <h2>Patient Registration</h2>
                <p class="text-muted">Register a new patient into the hospital queue system.</p>

                <div class="card shadow-sm col-md-8 p-4 bg-white">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Patient Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="e.g. John Doe">
                        </div>
                        <div class="mb-3">
                            <label for="age" class="form-label">Age</label>
                            <input type="number" class="form-control" id="age" name="age" required placeholder="e.g. 45">
                        </div>
                        <div class="mb-3">
                            <label for="department" class="form-label">Department</label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="" selected disabled>Select Department</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Orthopedics">Orthopedics</option>
                                <option value="General Medicine">General Medicine</option>
                                <option value="Pediatrics">Pediatrics</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="urgency" class="form-label">Triage Urgency Level</label>
                            <select class="form-select" id="urgency" name="urgency" required>
                                <option value="Normal" selected>Normal (Standard Queue)</option>
                                <option value="Emergency">Emergency (High Priority)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="reason" class="form-label">Reason for Visit / Symptoms</label>
                            <textarea class="form-control" id="reason" name="reason" rows="3" required placeholder="Describe symptoms briefly"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Register Patient & Generate Token</button>
                        <a href="{{ url_for('home') }}" class="btn btn-secondary ms-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
